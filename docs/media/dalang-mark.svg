<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 48" width="40" height="48" role="img" aria-label="Dalang AI">
  <title>Dalang AI</title>
  <!--
    Gunungan (kayon) yang disederhanakan, dengan segitiga play sebagai ruang
    negatif. Dipilih karena maknanya persis pekerjaan produk ini: di wayang
    kulit, gunungan-lah yang ditancapkan dalang untuk MEMBUKA lakon, MENANDAI
    pergantian adegan, dan menutupnya. Penanda adegan, di editor video yang
    seluruh datanya adalah rencana adegan.

    Bukan reproduksi kayon yang setia: bahunya dihaluskan dan nyala apinya
    dibuang supaya bentuknya tetap terbaca pada 16 piksel.
  -->
