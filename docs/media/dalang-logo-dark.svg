  <text x="64" y="41" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" letter-spacing="-0.4" fill="#eef0f4">Dalang<tspan dx="9" fill="#e8a33d">AI</tspan></text>
