<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" width="250" height="64" role="img" aria-label="Dalang AI">
  <title>Dalang AI</title>
  <!--
    Dua rupa, terang dan gelap, supaya wordmark tetap terbaca di kedua latar
    README GitHub. Marknya sama persis di keduanya: amber cukup kontras di
    atas putih maupun hitam, jadi hanya warna hurufnya yang ditukar.

