  <!-- carved frieze band top -->
  <g transform="translate(0 120)" fill="none" stroke="#54422F" stroke-width="7" opacity="0.85">
    <path d="M40 60 q40 -60 80 0 q40 -60 80 0 q40 -60 80 0 q40 -60 80 0 q40 -60 80 0 q40 -60 80 0 q40 -60 80 0 q40 -60 80 0 q40 -60 80 0 q40 -60 80 0 q40 -60 80 0 q40 -60 80 0"/>
    <path d="M40 130 h1000" stroke-width="5" opacity="0.6"/>
