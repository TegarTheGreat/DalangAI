<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="stoneWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2F26"/>
      <stop offset="0.5" stop-color="#2C241D"/>
      <stop offset="1" stop-color="#1E1813"/>
    </linearGradient>
    <linearGradient id="niche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171310"/>
      <stop offset="1" stop-color="#0F0C0A"/>
    </linearGradient>
    <linearGradient id="buddha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B5138"/>
      <stop offset="1" stop-color="#4A3826"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#E4A64C" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#E4A64C" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#E4A64C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#stoneWall)"/>

  <!-- horizontal cornices -->
  <g fill="#181310" opacity="0.85">
    <rect x="0" y="330" width="1080" height="26"/>
    <rect x="0" y="920" width="1080" height="26"/>
    <rect x="0" y="1510" width="1080" height="26"/>
  </g>
  <g fill="#4A3B2C" opacity="0.5">
    <rect x="0" y="356" width="1080" height="8"/>
    <rect x="0" y="946" width="1080" height="8"/>
    <rect x="0" y="1536" width="1080" height="8"/>
  </g>

