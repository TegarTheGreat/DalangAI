        <g transform="translate(95 216)">
          <ellipse cx="0" cy="88" rx="80" ry="26" fill="url(#buddha)"/>
          <path d="M-58 88 Q-58 10 0 6 Q58 10 58 88 Z" fill="url(#buddha)"/>
          <circle cx="0" cy="-20" r="30" fill="url(#buddha)"/>
        </g>
