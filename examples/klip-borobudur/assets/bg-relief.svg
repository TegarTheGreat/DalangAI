          <circle cx="0" cy="-24" r="34" fill="url(#buddha)"/>
          <path d="M0 -66 q12 10 0 22 q-12 -12 0 -22" fill="#6B5138"/>
        </g>
      </g>
      <g transform="translate(445 0)">
        <path d="M0 380 L0 120 Q0 20 95 20 Q190 20 190 120 L190 380 Z" fill="url(#niche)"/>
        <g transform="translate(95 236)">
          <ellipse cx="0" cy="96" rx="86" ry="30" fill="url(#buddha)"/>
