<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0E17"/>
      <stop offset="0.34" stop-color="#1B2547"/>
      <stop offset="0.62" stop-color="#5A3A54"/>
      <stop offset="0.82" stop-color="#C87B3B"/>
      <stop offset="1" stop-color="#E4A64C"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD98A" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#F2B45C" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F2B45C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2E44"/>
      <stop offset="1" stop-color="#241C33"/>
    </linearGradient>
    <linearGradient id="temple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241A28"/>
      <stop offset="1" stop-color="#120D18"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C88A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8C88A" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#E8C88A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#F5F0E6">
    <circle cx="120" cy="180" r="2.4" opacity="0.7"/><circle cx="360" cy="120" r="1.8" opacity="0.5"/>
    <circle cx="620" cy="240" r="2" opacity="0.6"/><circle cx="880" cy="150" r="2.6" opacity="0.7"/>
    <circle cx="990" cy="330" r="1.6" opacity="0.45"/><circle cx="220" cy="380" r="1.7" opacity="0.5"/>
    <circle cx="740" cy="90" r="1.5" opacity="0.4"/><circle cx="480" cy="330" r="1.6" opacity="0.4"/>
    <circle cx="90 " cy="560" r="1.8" opacity="0.35"/><circle cx="950" cy="520" r="1.8" opacity="0.4"/>
  </g>

  <!-- sun -->
  <circle cx="540" cy="1345" r="330" fill="url(#sunGlow)"/>
  <circle cx="540" cy="1345" r="128" fill="#FFCE7A"/>

  <!-- distant ridges -->
  <path d="M0 1350 L190 1230 L330 1315 L520 1200 L700 1305 L900 1215 L1080 1330 L1080 1920 L0 1920 Z" fill="url(#hillFar)" opacity="0.85"/>

  <!-- mist band -->
  <rect x="0" y="1300" width="1080" height="240" fill="url(#mist)"/>

  <!-- Borobudur silhouette -->
  <g fill="url(#temple)">
    <rect x="60" y="1560" width="960" height="360"/>
    <rect x="130" y="1500" width="820" height="70"/>
    <rect x="200" y="1444" width="680" height="64"/>
    <rect x="270" y="1392" width="540" height="60"/>
    <!-- stupa row -->
    <g>
      <path d="M330 1392 q30 -52 60 0 Z"/>
      <path d="M430 1392 q30 -52 60 0 Z"/>
      <path d="M590 1392 q30 -52 60 0 Z"/>
      <path d="M690 1392 q30 -52 60 0 Z"/>
      <rect x="352" y="1322" width="16" height="26"/>
      <rect x="452" y="1322" width="16" height="26"/>
      <rect x="612" y="1322" width="16" height="26"/>
      <rect x="712" y="1322" width="16" height="26"/>
    </g>
    <!-- main stupa -->
    <path d="M470 1392 q70 -104 140 0 Z"/>
    <rect x="524" y="1252" width="32" height="26"/>
    <rect x="530" y="1220" width="20" height="36"/>
    <path d="M536 1180 l4 -26 l4 26 Z"/>
  </g>

  <!-- notches on terraces -->
  <g fill="#0B0E17" opacity="0.55">
    <rect x="150" y="1512" width="26" height="18"/><rect x="240" y="1512" width="26" height="18"/>
    <rect x="330" y="1512" width="26" height="18"/><rect x="420" y="1512" width="26" height="18"/>
    <rect x="640" y="1512" width="26" height="18"/><rect x="730" y="1512" width="26" height="18"/>
    <rect x="820" y="1512" width="26" height="18"/><rect x="904" y="1512" width="26" height="18"/>
  </g>

  <!-- birds -->
  <g stroke="#1B1420" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M300 760 q22 -20 44 0 M344 760 q22 -20 44 0"/>
    <path d="M700 660 q18 -16 36 0 M736 660 q18 -16 36 0"/>
    <path d="M520 830 q14 -12 28 0 M548 830 q14 -12 28 0"/>
  </g>

  <!-- bottom depth -->
  <rect x="0" y="1700" width="1080" height="220" fill="#0B0E17" opacity="0.55"/>
</svg>
