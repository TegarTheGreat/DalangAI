<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="ashSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1C26"/>
      <stop offset="0.4" stop-color="#33323C"/>
      <stop offset="0.72" stop-color="#575148"/>
      <stop offset="1" stop-color="#6E6354"/>
    </linearGradient>
    <radialGradient id="craterGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E06A38" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#B84A2C" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B84A2C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2731"/>
      <stop offset="1" stop-color="#191721"/>
    </linearGradient>
    <linearGradient id="drift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E8578"/>
      <stop offset="1" stop-color="#6B6355"/>
    </linearGradient>
    <linearGradient id="driftFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A7164"/>
      <stop offset="1" stop-color="#514A3F"/>
    </linearGradient>
    <linearGradient id="buried" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221E2B"/>
      <stop offset="1" stop-color="#161320"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#ashSky)"/>

  <!-- ash plume drifting left -->
  <g fill="#3E3A42">
    <ellipse cx="700" cy="560" rx="150" ry="80" opacity="0.95"/>
    <ellipse cx="600" cy="450" rx="200" ry="100" opacity="0.9"/>
    <ellipse cx="450" cy="330" rx="250" ry="120" opacity="0.85"/>
    <ellipse cx="260" cy="210" rx="290" ry="140" opacity="0.8"/>
    <ellipse cx="60" cy="110" rx="300" ry="150" opacity="0.7"/>
  </g>
  <g fill="#4A4550">
    <ellipse cx="660" cy="520" rx="90" ry="48" opacity="0.9"/>
    <ellipse cx="520" cy="390" rx="130" ry="66" opacity="0.85"/>
    <ellipse cx="330" cy="260" rx="170" ry="84" opacity="0.8"/>
  </g>

  <!-- volcano -->
  <ellipse cx="760" cy="660" rx="240" ry="120" fill="url(#craterGlow)"/>
  <path d="M1160 1240 L790 620 L742 668 L700 630 L360 1240 Z" fill="url(#cone)"/>
  <path d="M790 620 L742 668 L700 630" fill="none" stroke="#E06A38" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <path d="M790 620 L1050 1080" stroke="#4E4656" stroke-width="7" opacity="0.6"/>

  <!-- falling ash -->
  <g stroke="#B0A896" stroke-linecap="round" opacity="0.5">
    <path d="M150 500 l-14 46" stroke-width="6"/>
    <path d="M320 640 l-12 40" stroke-width="5"/>
    <path d="M90 840 l-12 40" stroke-width="5"/>
    <path d="M520 760 l-13 44" stroke-width="6"/>
    <path d="M240 1000 l-11 38" stroke-width="5"/>
    <path d="M660 940 l-12 40" stroke-width="5"/>
    <path d="M930 880 l-12 42" stroke-width="6"/>
    <path d="M430 1120 l-10 36" stroke-width="5"/>
    <path d="M820 1180 l-11 38" stroke-width="5"/>
  </g>
  <g fill="#B0A896" opacity="0.55">
    <circle cx="200" cy="700" r="6"/><circle cx="420" cy="560" r="5"/>
    <circle cx="720" cy="800" r="6"/><circle cx="560" cy="1040" r="5"/>
    <circle cx="960" cy="1060" r="5"/><circle cx="120" cy="1160" r="6"/>
  </g>

  <!-- temple buried to its shoulders in pale ash -->
  <g fill="url(#buried)">
    <rect x="240" y="1330" width="600" height="160"/>
    <rect x="320" y="1272" width="440" height="70"/>
    <g>
      <path d="M370 1272 q26 -46 52 0 Z"/>
      <path d="M470 1272 q26 -46 52 0 Z"/>
      <path d="M570 1272 q26 -46 52 0 Z"/>
      <path d="M660 1272 q26 -46 52 0 Z"/>
    </g>
    <path d="M460 1252 q80 -120 160 0 Z"/>
    <rect x="524" y="1120" width="32" height="28"/>
    <rect x="531" y="1084" width="18" height="40"/>
  </g>

  <!-- pale ash drifts swallowing the temple -->
  <path d="M-40 1450 Q140 1360 330 1420 Q520 1350 700 1418 Q880 1355 1120 1440 L1120 1920 L-40 1920 Z" fill="url(#drift)"/>
  <path d="M-40 1650 Q180 1560 400 1630 Q620 1555 840 1630 Q980 1580 1120 1640 L1120 1920 L-40 1920 Z" fill="url(#driftFront)"/>

  <!-- drift shading -->
  <g stroke="#57503F" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M120 1500 q90 -26 180 0"/>
    <path d="M560 1490 q100 -30 200 4"/>
    <path d="M240 1700 q110 -30 220 0"/>
    <path d="M700 1710 q100 -26 200 -2"/>
  </g>

  <!-- foreground fern silhouettes -->
  <g fill="#14181A">
    <path d="M-30 1920 L-30 1560 Q40 1600 60 1700 Q110 1620 90 1520 Q170 1600 170 1720 Q230 1660 210 1560 Q280 1680 260 1920 Z"/>
    <path d="M1110 1920 L1110 1600 Q1040 1640 1020 1740 Q970 1660 990 1560 Q910 1650 910 1760 Q850 1700 870 1600 Q800 1720 820 1920 Z"/>
  </g>
</svg>
