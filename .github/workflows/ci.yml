name: CI

on:
  # Hanya main: tanpa batasan ini SETIAP commit di branch ber-PR menjalankan CI
  # DUA kali (push + pull_request), dan grup concurrency-nya berbeda
  # (refs/heads/... vs refs/pull/N/merge) sehingga keduanya tidak saling
  # membatalkan. Dua kali menjalankan Chromium per commit berarti dua kali
  # peluang kena flake browser — dan itu sudah terjadi: satu run gagal
  # "Timed out while trying to connect to the browser" sementara run kembarnya
  # pada commit yang sama lulus.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (incl. JSON Schema up-to-date check)
        run: pnpm test

      # ADR-0022: rangka eval (penilai + papan skor) dijalankan tanpa model
      # sama sekali, atas plan contoh repo. Tidak mengukur mutu agent — mustahil
      # tanpa memanggil model berbayar di CI — tapi menangkap dua regresi yang
      # tidak ditangkap tes mana pun: penilai yang rusak diam-diam, dan plan
      # contoh yang diedit sampai melanggar kaidahnya sendiri.
      - name: Eval self-check (rangka penilai, tanpa model)
        run: pnpm --filter @dalang/agent eval --self-check

      - name: Build app studio (Vite)
        run: pnpm --filter @dalang/studio build

      # Geometri header/panel di 15 lebar layar nyata. Ini menangkap kelas bug
      # yang TIDAK menggagalkan tes mana pun: kontrol yang saling menindih atau
      # tergunting habis — DOM benar, komponen ter-render, semua hijau, tapi
      # kotaknya bertumpuk. Memakai Chromium yang sama dengan render smoke test.
      - name: Layout gate (studio UI)
        timeout-minutes: 6
        run: pnpm --filter @dalang/studio gate:layout

      # Gerbang tata letak membuktikan kendali MUAT; yang ini membuktikan
      # kendali BEKERJA saat disentuh: berlian keyframe dan kotak anotasi
      # diseret dengan pointer/papan ketik sungguhan lewat CDP, lalu plan di
      # server yang diperiksa — seretan yang tidak mengirim patch adalah cacat
      # yang tidak ditangkap unit test mana pun.
      - name: Interaction gate (studio UI)
        timeout-minutes: 6
        run: pnpm --filter @dalang/studio gate:interaksi

      - name: Validate demo scene-plan
        run: |
          pnpm dalang validate examples/borobudur-60s/plan.json
          pnpm dalang validate examples/klip-borobudur/plan.json
          pnpm dalang validate examples/klip-hook/plan.json
          pnpm dalang validate examples/sulih-dua-bahasa/plan.json
          pnpm dalang validate examples/pengayaan/plan.json

      # Real still render through the full stack (bundle → Chromium → PNG):
      # the template-regression safety net (R-8 precursor). Uses the runner's
      # preinstalled Chrome via the renderer's browser detection.
      - name: Render smoke test
        # Langkah ini yang menyalakan Chromium. Kalau browsernya menggantung,
        # prosesnya tetap hidup dan menahan job sampai batas 20 menit — pernah
        # terjadi. Batas sendiri membuat kegagalan browser berbiaya menit, bukan
        # seluruh anggaran job.
        timeout-minutes: 8
        run: |
          pnpm dalang still examples/borobudur-60s/plan.json -t 8 29 -s 0.25 -o /tmp/smoke
          test -s /tmp/smoke/borobudur-60s-f240.png
          test -s /tmp/smoke/borobudur-60s-f870.png
          # Fase 4: preset tutorial-01 (screenshot + anotasi zoom/highlight/arrow)
          # Detik 18 sengaja ikut: di situ LAPISAN video (ADR-0025) sedang
          # tampil, jadi jalur render sisipan benar-benar dijalankan — bukan
          # hanya diuji sebagai angka.
          pnpm dalang still examples/tutorial-studio/plan.json -t 8 18 21.5 -s 0.25 -o /tmp/smoke
          test -s /tmp/smoke/tutorial-studio-f240.png
          test -s /tmp/smoke/tutorial-studio-f540.png
          test -s /tmp/smoke/tutorial-studio-f645.png
          # ADR-0033: satu-satunya contoh berklip banyak. Tanpa langkah ini
          # jalur ClipStrip — potong keras dan TransitionSeries DI DALAM satu
          # scene — tidak pernah benar-benar dirender di CI. Detik 9,13 adalah
          # titik potong klip 2 ke klip 3, yaitu tengah larutnya.
          # Detik 7,83 ada di TENGAH punch-in berkeyframe klip kedua (ADR-0036),
          # yaitu satu-satunya bingkai CI yang membuktikan kamera keyframe
          # benar-benar sampai ke layar lewat jalur ASET.
          pnpm dalang still examples/klip-borobudur/plan.json -t 5 7.83 9.13 11 -s 0.25 -o /tmp/smoke
          test -s /tmp/smoke/klip-borobudur-f150.png
          test -s /tmp/smoke/klip-borobudur-f235.png
          test -s /tmp/smoke/klip-borobudur-f274.png
          test -s /tmp/smoke/klip-borobudur-f330.png
          # ADR-0035: satu-satunya contoh berpreset klip-01. Tanpa langkah ini
          # preset ketiga tidak pernah dirender gerbang mana pun, dan regresinya
          # baru ketahuan kalau ada yang merender manual — yang tidak terjadi.
          # Detik 0,7 memuat teks hook yang masih penuh; detik 8 memuat caption
          # berpelat di tengah kalimat; detik 19 memuat chip outro.
          # Detik 13,9 ada di ujung tarik-mundur berkeyframe scene ketiga
          # (ADR-0036), lewat jalur PROSEDURAL — jalur yang berbeda dari klip
          # beraset dan karena itu perlu bingkainya sendiri.
          pnpm dalang still examples/klip-hook/plan.json -t 0.7 8 13.9 19 -s 0.25 -o /tmp/smoke
          test -s /tmp/smoke/klip-hook-f21.png
          test -s /tmp/smoke/klip-hook-f240.png
          test -s /tmp/smoke/klip-hook-f417.png
          test -s /tmp/smoke/klip-hook-f570.png

      # ADR-0037: template bawaan wajib benar-benar MENGHASILKAN VIDEO, bukan
      # cuma lulus skema. Test unit sudah menjaga bentuk dan kaidah
      # sutradaranya; yang tidak bisa dijaga test unit adalah "plan yang lahir
      # dari template ini bisa dirender" — dan template yang tidak pernah
      # dirender adalah template yang tidak terbukti berguna.
      - name: Gerbang template (ketiga bawaan jadi proyek yang dirender)
        env:
          DALANG_HOME: /tmp/dalang-home
        run: |
          set -euo pipefail
          pnpm dalang template daftar
          for id in klip-tiga-detik esai-video tutorial-langkah; do
            pnpm dalang template mulai "$id" --out "/tmp/tpl/$id" --judul "Uji $id"
            pnpm dalang validate "/tmp/tpl/$id/plan.json"
            pnpm dalang still "/tmp/tpl/$id/plan.json" -t 1 -s 0.25 -o "/tmp/tpl/$id"
          done
          test -s /tmp/tpl/klip-tiga-detik/klip-tiga-detik-f30.png
          test -s /tmp/tpl/esai-video/esai-video-f30.png
          test -s /tmp/tpl/tutorial-langkah/tutorial-langkah-f30.png

      # ADR-0019: aset plan boleh diambil dari public dir bundle (render lokal)
      # ATAU dari URL (render cloud). Gerbang ini merender kedua jalur dan
      # menuntut hasilnya identik byte per byte. Satu pemanggil staticFile()
      # yang terlewat tidak menggagalkan unit test mana pun — hanya ini.
      # ADR-0023: klaim "berkas ekspor kami benar-benar bisa dibuka perkakas
      # lain" tidak bisa dibuktikan tes unit — pembaca kita sendiri hanya
      # membuktikan dua berkas kita saling setuju. Gerbang ini memakai
      # IMPLEMENTASI RUJUKAN: pustaka OpenTimelineIO resmi membaca .otio kita,
      # adapter fcpx_xml resmi membaca .fcpxml kita, lalu posisi tiap klip
      # dibandingkan dengan `activeSceneIndex` milik renderer.
      - name: Interop gate (pembaca rujukan OTIO/FCPXML)
        timeout-minutes: 5
        run: |
          python3 -m pip install --quiet --disable-pip-version-check opentimelineio otio-fcpx-xml-adapter
          pnpm --filter @dalang/interop gate:interop
          # Kedua contoh, bukan satu: tutorial-studio memakai anotasi dan
          # preset lain, dan cabang "scene tanpa aset" berperilaku berbeda.
          pnpm --filter @dalang/interop gate:interop examples/tutorial-studio/plan.json
          # Contoh berklip banyak: di sini pemetaan satu-klip-per-KLIP diuji
          # atas plan yang MEMANG berklip banyak, bukan varian bikinan gerbang.
          pnpm --filter @dalang/interop gate:interop examples/klip-borobudur/plan.json

      # ADR-0033: skema naik ke v2 dan `parseScenePlan` memigrasikan plan v1.
      # Unit test migrasi hanya membuktikan bentuknya cocok dengan yang
      # DIHARAPKAN penulis testnya; satu field yang lupa ikut pindah tetap
      # lolos skema dan baru terlihat sebagai gambar yang bergeser. Gerbang ini
      # merender plan v1 (dimigrasikan saat dibaca) dan plan v2 yang sama, lalu
      # menuntut hasilnya identik byte per byte.
      - name: Gerbang paritas migrasi skema (v1 -> v2)
        timeout-minutes: 8
        run: |
          pnpm --filter @dalang/renderer migrasi-paritas
          pnpm --filter @dalang/renderer migrasi-paritas examples/tutorial-studio/plan.json

      # ADR-0041: pengayaan. Preset warna, efek lapisan, transisi, gerak, gaya
      # caption, dan animasi teks semuanya DATA yang lolos skema apa pun —
      # nilai yang tidak terdaftar di peta CSS menghasilkan gambar yang
      # terlihat persis seperti tanpa efek, tanpa galat dan tanpa tes merah.
      # Gerbang ini MENGUKUR bingkainya: vignette wajib menggelapkan sudut
      # relatif terhadap tengah, butiran wajib menaikkan beda piksel
      # bertetangga, dan keduanya wajib melakukannya tanpa saling meniru.
      - name: Gerbang pengayaan (efek diukur di bingkai, bukan diklaim)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          pnpm dalang still examples/pengayaan/plan.json -t 2 8 14 -s 0.3 -o /tmp/kaya
          test -s /tmp/kaya/pengayaan-f60.png
          test -s /tmp/kaya/pengayaan-f240.png
          test -s /tmp/kaya/pengayaan-f420.png
          pnpm --filter @dalang/templates gate:pengayaan

      # ADR-0040: sulih suara. Gerbang ini menjalankan JALUR PENUH atas contoh
      # bersulihan: TTS bahasa sulih (provider silence, offline dan gratis),
      # lalu pemeriksaan bahwa tiap bahasa jadi plan satu-bahasa yang utuh dan
      # durasinya ikut narasinya, lalu satu bingkai benar-benar DIRENDER dalam
      # bahasa itu. Yang terakhir yang tidak bisa dijamin tes mana pun: plan
      # hasil tukar yang tidak bisa dirender tetap lolos setiap pemeriksaan
      # struktur.
      - name: Gerbang sulih suara (tukar bahasa, render bahasa itu)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # Sebelum TTS: teksnya saja. Ini keadaan proyek yang baru
          # diterjemahkan, dan gerbangnya harus lulus di situ juga.
          pnpm --filter @dalang/templates gate:sulih
          # Sesudah TTS: berkas suaranya ada, dan durasinya datang dari
          # berkas, bukan dari taksiran suku kata.
          cp -r examples/sulih-dua-bahasa /tmp/sulih
          pnpm dalang sulih /tmp/sulih --bahasa en --suara
          pnpm --filter @dalang/templates gate:sulih /tmp/sulih/plan.json
          pnpm dalang subtitle /tmp/sulih --bahasa en -o /tmp/sulih/en.srt
          test -s /tmp/sulih/en.srt
          grep -q "two languages" /tmp/sulih/en.srt
          # Bingkai yang sama dirender DUA kali, sekali per bahasa. Detik 6,5
          # jatuh di tengah caption scene kedua, jadi kedua PNG memuat teks
          # yang berbeda — cara paling langsung membuktikan bahasanya sampai
          # ke layar, bukan cuma ke JSON.
          pnpm dalang still /tmp/sulih -t 6.5 -s 0.3 -o /tmp/sulih/id
          pnpm dalang still /tmp/sulih -t 6.5 -s 0.3 -o /tmp/sulih/en --bahasa en
          test -s /tmp/sulih/id/sulih-f195.png
          test -s /tmp/sulih/en/sulih-f195.png
          # Dua bingkai yang IDENTIK berarti bahasanya tidak sampai ke render.
          if cmp -s /tmp/sulih/id/sulih-f195.png /tmp/sulih/en/sulih-f195.png; then
            echo "GERBANG SULIH GAGAL: bingkai id dan en identik byte per byte" >&2
            exit 1
          fi

      # ADR-0039: berkas subtitle punya dua klaim yang tidak bisa dibuktikan tes
      # unit. Pertama, "berkasnya terbaca pemutar lain" — pembaca kita sendiri
      # cuma membuktikan dua berkas kita saling setuju, jadi gerbang ini memakai
      # pustaka `webvtt-py` sebagai IMPLEMENTASI RUJUKAN. Kedua, dan ini yang
      # paling mahal: "waktunya cocok dengan videonya". Teks yang melenceng
      # tetap berupa berkas yang sah dan lolos setiap tes format; cacatnya cuma
      # terlihat oleh penonton yang menyalakan teksnya. Jangkarnya
      # `activeSceneIndex` milik renderer — tiap kartu harus jatuh di scene yang
      # narasinya memuat teksnya.
      - name: Gerbang subtitle (pembaca rujukan + jangkar bingkai)
        timeout-minutes: 3
        run: |
          python3 -m pip install --quiet --disable-pip-version-check webvtt-py
          pnpm --filter @dalang/templates gate:subtitle
          # Contoh berklip banyak: di sini scene bertumpuk DI DALAM scene juga,
          # jadi jalur waktunya berbeda dari plan berklip satu.
          pnpm --filter @dalang/templates gate:subtitle examples/klip-borobudur/plan.json
          # Preset lain, caption dari anotasi tutorial.
          pnpm --filter @dalang/templates gate:subtitle examples/tutorial-studio/plan.json
          pnpm --filter @dalang/templates gate:subtitle examples/klip-hook/plan.json

      - name: Asset URL parity gate
        timeout-minutes: 8
        run: |
          pnpm --filter @dalang/renderer asset-url-parity
          pnpm --filter @dalang/renderer asset-url-parity examples/tutorial-studio/plan.json

      # Kalau salah satu gerbang paritas merah, PNG yang berselisih ikut naik.
      # Selisih byte tidak bisa dilihat; gambarnya bisa — dan tanpa langkah ini
      # satu-satunya cara memeriksanya adalah menebak dari jauh.
      - name: Upload bukti paritas (hanya bila merah)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bukti-paritas
          path: artefak-paritas
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload smoke frames
        uses: actions/upload-artifact@v4
        with:
          name: render-smoke
          path: /tmp/smoke
          retention-days: 14
